[package]
name = "sequence-master"
version = "1.0.0"
description = "Sequence Master 序列大师 — 序列逻辑推理游戏桌面版"
authors = ["Jason-Frog"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sequence_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
